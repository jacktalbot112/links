<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#061410" />
<title>Jack Talbot | Explore</title>
<meta name="description" content="Director at Leverage Capital and co-founder of Co.Credit." />

<!-- Open Graph -->
<meta property="og:title" content="Jack Talbot | Explore" />
<meta property="og:description" content="Director at Leverage Capital and co-founder of Co.Credit." />
<meta property="og:type" content="profile" />

<!-- Favicons -->
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="portrait" aria-hidden="true">
      <img src="portrait.jpg" alt="" />
    </div>
    <h1 class="name" id="profile-name">JACK TALBOT</h1>
  </section>

  <section class="info">
    <p class="info-text">
      <span id="profile-bio"></span>
    </p>
  </section>

  <div class="scroll-hint" aria-hidden="true">
    <span>Scroll</span>
    <svg viewBox="0 0 24 12" width="20" height="10">
      <path d="M0,6 L20,6 M14,1 L20,6 L14,11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <section class="carousel-wrap" aria-label="Links">
    <div class="carousel-track" id="carousel-track" role="list"></div>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="document">
    <button class="modal-close" data-close aria-label="Close">×</button>
    <div class="modal-media" id="modal-media"></div>
    <div class="modal-body">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <div class="modal-cta-row">
        <a id="modal-link" class="modal-cta" href="#" target="_blank" rel="noopener"></a>
        <span class="modal-cta-label">Click to explore more.</span>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
